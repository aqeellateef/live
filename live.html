<!-- قسم سيرفرات البث المباشر -->
<div style="max-width: 1200px; margin: 30px auto; padding: 20px; color: #fff; font-family: Arial, sans-serif;">
    <h2 style="text-align: center; margin-bottom: 20px; color: #3b82f6;">📺 أقسام البث المباشر</h2>
    
    <!-- حاوية الأقسام -->
    <div id="categories-container" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; justify-content: center; flex-wrap: wrap;">
        <!-- سيتم تعبئة الأقسام تلقائياً هنا -->
    </div>

    <h3 id="category-title" style="margin-top: 30px; border-bottom: 2px solid #3b82f6; padding-bottom: 8px; text-align: right;">اختر قسماً لعرض القنوات</h3>
    
    <!-- حاوية القنوات -->
    <div id="channels-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px;">
        <!-- سيتم تعبئة القنوات تلقائياً هنا -->
    </div>
</div>

<script>
const PROXY_URL = "https://apps404.vercel.app/proxy.js"; // رابط مشروعك على Vercel

// جلب الأقسام عند تحميل الصفحة
async function loadCategories() {
    try {
        const res = await fetch(PROXY_URL);
        const categories = await res.json();
        const container = document.getElementById('categories-container');
        container.innerHTML = '';

        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.innerText = cat.name || cat.title;
            btn.style.cssText = "background: #1e293b; color: #fff; border: 1px solid #3b82f6; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; white-space: nowrap;";
            
            btn.onmouseover = () => btn.style.background = '#3b82f6';
            btn.onmouseout = () => btn.style.background = '#1e293b';
            
            btn.onclick = () => loadChannels(cat.id, cat.name || cat.title);
            container.appendChild(btn);
        });
    } catch (err) {
        console.error("خطأ في جلب الأقسام:", err);
    }
}

// جلب قنوات قسم معين
async function loadChannels(catId, catName) {
    document.getElementById('category-title').innerText = `قنوات قسم: ${catName}`;
    const container = document.getElementById('channels-container');
    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #94a3b8;">جاري تحميل القنوات...</p>';

    try {
        const res = await fetch(`${PROXY_URL}?action=channels&cat=${catId}`);
        const channels = await res.json();
        container.innerHTML = '';

        channels.forEach(ch => {
            const card = document.createElement('div');
            card.style.cssText = "background: #1e293b; border-radius: 10px; padding: 15px; text-align: center; border: 1px solid #334155;";
            
            card.innerHTML = `
                <img src="${ch.logo || 'https://via.placeholder.com/80'}" alt="${ch.name}" style="width: 70px; height: 70px; object-fit: contain; margin-bottom: 10px; border-radius: 8px;">
                <h4 style="font-size: 14px; margin: 10px 0; color: #f8fafc;">${ch.name}</h4>
                <button onclick="playChannel('${ch.url}')" style="background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; width: 100%;">تشغيل البث</button>
            `;
            container.appendChild(card);
        });
    } catch (err) {
        container.innerHTML = '<p style="text-align: center; color: #ef4444; grid-column: 1 / -1;">فشل في تحميل القنوات</p>';
    }
}

// دالة تشغيل البث
function playChannel(streamUrl) {
    alert("رابط البث: " + streamUrl);
    // يمكنك فتح مشغل الفيديو هنا لاحقاً
}

// تنفيذ جلب الأقسام أول ما يفتح الموقع
loadCategories();
</script>
