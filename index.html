<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث المزدوج الاحترافي</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 900px;
            background: #111827;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        /* تنسيق ملء الشاشة لمتصفح كروم وباقي المتصفحات */
        .main-wrapper:fullscreen {
            max-width: 100% !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #000;
            padding: 0;
        }
        .main-wrapper:-webkit-full-screen {
            max-width: 100% !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #000;
            padding: 0;
        }

        .main-wrapper:fullscreen .video-container,
        .main-wrapper:-webkit-full-screen .video-container {
            flex-grow: 1;
            height: auto;
            padding-bottom: 0;
        }

        /* حاوية الإعلانات المدمجة */
        .ad-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header-bar {
            padding: 16px 24px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rotate-btn {
            background: #374151;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .rotate-btn:hover {
            background: #4b5563;
            transform: scale(1.05);
        }

        .live-badge {
            background: #ef4444;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* نسبة الأبعاد 16:9 */
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .telegram-bar {
            background: linear-gradient(135deg, #0088cc, #0077b5);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .telegram-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .telegram-bar:hover::after {
            left: 100%;
        }

        .telegram-bar:hover {
            background: linear-gradient(135deg, #0099e6, #0088cc);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .telegram-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 1rem;
        }

        .telegram-icon {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        .telegram-btn {
            background: #ffffff;
            color: #0088cc;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .telegram-bar:hover .telegram-btn {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .main-wrapper {
                border-radius: 10px;
            }
            .header-bar, .telegram-bar {
                padding: 12px 16px;
            }
            .telegram-info span {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

    <script>
        function forceRotateChrome(wrapperId) {
            const elem = document.getElementById(wrapperId);
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

            if (!isFullscreen) {
                let requestFn = elem.requestFullscreen || elem.webkitRequestFullscreen;
                if (requestFn) {
                    requestFn.call(elem).then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {});
                        }
                    }).catch(() => {});
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }
    </script>
