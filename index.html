<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <iframe id="secureFrame" src="" allow="fullscreen; autoplay; encrypted-media" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>

    <script>
        const encodedUrl = "aHR0cHM6Ly9saXZlLXR2LTExNjg0OTAyNjE2Ni5ldXJvcGUtd2VzdDEucnVuLmFwcA==";
        document.getElementById('secureFrame').src = atob(encodedUrl);

        document.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('keydown', function(e) {
            const key = e.key.toLowerCase();
            if (
                e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) || 
                (e.ctrlKey && (key === 'u' || key === 's' || key === 'p'))
            ) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        (function() {
            const threshold = 160;
            const checkDevTools = function() {
                if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
                    document.body.innerHTML = '<div style="color:white; text-align:center; padding-top:20vh; font-family:sans-serif;"><h2>Access Denied</h2></div>';
                }
            };
            setInterval(checkDevTools, 1000);
        })();

        document.addEventListener('dragstart', e => e.preventDefault());
    </script>
</body>
</html>
