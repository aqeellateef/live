<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <iframe id="secureFrame" src="" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

    <script>
        // تشفير الرابط الأساسي بطريقة Base64 لمنع قراءته مباشرة
        // الرابط الأصلي: https://live404.ai.studio
        const encodedUrl = "aHR0cHM6Ly9saXZlNDA0LmFpLnN0dWRpbw==";
        
        // فك تشفير الرابط وتطبيقه برمجياً
        document.getElementById('secureFrame').src = atob(encodedUrl);

        // منع استخدام زر الفأرة الأيمن
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // منع اختصارات لوحة المفاتيح الخاصة بعرض المصدر وأدوات المطورين
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.keyCode == 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I أو Ctrl+Shift+J أو Ctrl+U
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.keyCode == 85) {
                e.preventDefault();
                return false;
            }
        });

        // كشف محاولات فتح أدوات المطورين وإعادة توجيه الصفحة أو إيقافها
        setInterval(function() {
            const widthThreshold = window.outerWidth - window.innerWidth > 160;
            const heightThreshold = window.outerHeight - window.innerHeight > 160;
            if (widthThreshold || heightThreshold) {
                document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:20vh;'>تم اكتشاف محاولة فحص الكود!</h1>";
            }
        }, 1000);
    </script>
</body>
</html>
