<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث الموقع</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            font-family: Tahoma, Arial, sans-serif;
            color: #ffffff;
        }
        .card {
            background-color: #1e293b;
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 350px;
            width: 90%;
        }
        h2 {
            margin-bottom: 15px;
            color: #f8fafc;
            font-size: 22px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>تم تغيير موقعنا!</h2>
        <p>تم إطلاق وتحديث موقعنا الجديد كلياً. انضم إلينا الآن للحصول على الرابط المباشر واستعراض التحديثات.</p>
        <a href="https://t.me/c1_x2" target="_blank" class="btn">انضم الآن</a>
    </div>

</body>
</html>
